name: HealPlate CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build solution
      run: dotnet build "Aplicatie Culinara HealPlate.sln" --configuration Release

    - name: Run unit tests with coverage
      run: |
        dotnet test "Aplicatie_Culinara_HealPlate.Tests/Aplicatie_Culinara_HealPlate.Tests.csproj" \
          --configuration Release \
          --logger "trx;LogFileName=test_results.trx" \
          /p:CollectCoverage=true \
          /p:CoverletOutputFormat=cobertura \
          /p:CoverletOutput="Aplicatie_Culinara_HealPlate.Tests/TestResults/Coverage/"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      with:
        name: TestResults
        path: Aplicatie_Culinara_HealPlate.Tests/TestResults/
